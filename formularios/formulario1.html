    <title>Formulários</title>

<body>

    <h1>Formulários</h1>

    <!--
        form -> (formulário)
        input -> entrada de dados
        submit -> enviar 
        button -> botão
    -->
    
    <form >

        Email: <br>
        <input type="text" name="email"> <br>

        Senha: <br>

        Comentário: <br>

        <br>

        <button type="submit">
            <img src="../primeiro-projeto/imagens/b6.jpg" alt="" width="10">Entrar
        </button>




    </form>

    
</body>
