<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface do Trello</title>
    
</head>
 
<body>
    <img src="trello.svg" width="200">
    <h1>Fazer login no Trello</h1>

    <br><br>

    <form action="" method="get">

        <input type="text" name="email" placeholder="Insira o e-mail"> <br>
        <input type="password" name="senha" placeholder="Insira a senha"> <br>

        <input type="submit" value="Fazer login" >

        <br><br>
        <span>Ou</span>
        <br><br>

        <button>
            <img src="google.svg" width="20px"> Continuar com o Google</button>
        <br><br>
        <button>
            <img src="microsoft.svg" width="20px"> Continuar com o Microsoft</button>
        <br><br>
        <button>
            <img src="apple.svg" width="20px"> Continuar com a Apple</button>
        <br><br>
        <button>
            <img src="slack.svg" width="20px" > Continuar com o Slack</button>

        <br><br><br>

    </form>

    <img src="atlassian.svg" width="200" alt=""> 
    <img src="analytics.svg" width="200" alt=""> 
    <img src="interactive.svg" width="200">

</body>
</html>
