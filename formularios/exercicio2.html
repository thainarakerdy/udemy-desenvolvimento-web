<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Formulário</title>
</head>
<body>
    <h1>Exercício de formulários</h1>
    <form action="">
        <fieldset>
            <legend>Dados Pessoais</legend>
             <label for="name">Nome</label> <br>
                <input type="text" name="nome" id="nome"> <br>
             <label for="email">E-mail</label> <br>
                <input type="text" name="email" id="email"> <br>
            <input type="checkbox" name="receber" id="receber"> Quero receber e-mail
            <br><br>Senha <br>
            <input type="password"> 
        </fieldset>
        <fieldset>
            <legend>Informações adicionais</legend>
            <input type="radio" name="pessoa" value="Pessoa Física"> Pessoa Física 
            <input type="radio" name="pessoa" value="Pessoa Jurídica"> Pessoa Jurídica
        </fieldset>
        <br>

        <button type="submit" name="cadastrar">Cadastrar</button>
    </form>


</body>
</html>
