<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Formulário</title>
</head>
<body>
    <h1>Exercício de formulários</h1>
    <form action="">
        <fieldset>
            <legend>Dados Pessoais</legend>

             <label for="name">Nome</label> <br>
                <input type="text" name="nome" id="nome"> <br>

             <label for="email">E-mail</label> <br>
                <input type="text" name="email" id="email"> <br>

            <label for="receber">Quero receber e-mail</label>
                <input type="checkbox" name="receber" id="receber">

            <br><br>
            <label for="senha">Senha</label> <br>
                <input type="password" name="senha" id="senha"> 
        </fieldset>
        <fieldset>
            <legend>Informações adicionais</legend>
            
            <label for="pf">Pessoa Física</label>
                <input type="radio" name="pessoa" value="pf" id="pf">

            <label for="pj">Pessoa Jurídica</label>
                <input type="radio" name="pessoa" value="pj" id="pj"> 
        </fieldset>
        <br>

        <button type="submit" name="cadastrar">Cadastrar</button>
    </form>


</body>
</html>
